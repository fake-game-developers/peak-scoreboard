[config]
schemaVersion = "0.1.0"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "FakeGameDevelopers"
name = "PeakScoreboard"
description = "Toggle scoreboard: avatars, stamina, effects, height/travel/deaths; host-only respawn; API for other mods. Rebindable hotkey."
websiteUrl = "https://github.com/fake-game-developers/peak-scoreboard"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_PEAK = "5.4.2403"

[build]
icon = "../../icon.png"
readme = "../../THUNDERSTORE.md"
outdir = "../../artifacts/thunderstore/"

[[build.copy]]
source = "../../artifacts/bin/PeakScoreboard/release/PeakScoreboard.dll"
target = "plugins/"

[[build.copy]]
source = "../../CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../../LICENSE"
target = "/"

[publish]
communities = [ "peak", ]

# Fallback for a first publish. CI replaces this with the live package categories.
[publish.categories]
peak = [ "mods", "qol", "client", "ai-generated" ]
